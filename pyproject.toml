[project]
name = "tyto-voice"
version = "0.1.0"
description = "Python reference for the Tyto acoustics-aware voice-agent demo"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    # 3.x is required: Tyto 1.1 is a model-version-7 artifact and the streaming
    # analyzer API changed (mono buffers, block_size, codec_degradation).
    "aic-sdk>=3.2",
    "numpy>=1.24",
    "sounddevice>=0.4",
]

[project.optional-dependencies]
# The terminal voice agent adds the GPT-Live / Realtime WebSocket client and the
# HTTP client Jev is called with.
agent = ["websockets>=13", "httpx>=0.27"]
# The browser demo adds the web server.
web = ["websockets>=13", "httpx>=0.27", "aiohttp>=3.9"]
# Everything, plus the test runner.
dev = ["websockets>=13", "httpx>=0.27", "aiohttp>=3.9", "pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tyto_voice"]

[tool.pytest.ini_options]
testpaths = ["tests"]
