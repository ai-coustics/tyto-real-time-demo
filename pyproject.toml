[project]
name = "tyto-voice"
version = "0.1.0"
description = "Python reference for the Tyto acoustics-aware voice-agent demo"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    # Pinned with the model id: Tyto 1.2 is a model-file-version-8 artifact that
    # 3.3.x and earlier reject, and 3.4.0 (core 0.26.0) can no longer load 1.1.
    "aic-sdk==3.4.0",
    "numpy>=1.24",
    "sounddevice>=0.4",
]

[project.optional-dependencies]
# The terminal voice agent adds the GPT-Live / Realtime WebSocket client and the
# HTTP client Jev is called with.
agent = ["websockets>=13", "httpx>=0.27"]
# The browser demo adds the web server.
web = ["websockets>=13", "httpx>=0.27", "aiohttp>=3.9"]
# Everything, plus the test runner.
dev = ["websockets>=13", "httpx>=0.27", "aiohttp>=3.9", "pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tyto_voice"]

[tool.pytest.ini_options]
testpaths = ["tests"]
